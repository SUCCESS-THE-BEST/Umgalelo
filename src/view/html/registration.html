<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/registration.css">
        <link rel="icon" type="image/png" href="../images/favicon.png">
</head>
<body>
    <div class="registration-container">

      <div class="welcome-section">
        <!-- <img src='../images/holding hands.jpg' alt="Background" class="background-image" /> -->
        <div class="welcome-content">
          <button class="back-link" type="button" onclick="window.location.href='landingPage.html'">
              <span>←</span> Back to home
          </button>
          <img src='../images/umgalelo.png' alt="Logo" class="logo" />
          <h1 class="welcome-title">Get started with your account</h1>
          <p class="welcome-subtitle">Connect, contribute, and grow with Umgalelo</p>
          <div class="login-section">
            <span class="login-text">Already signed up?</span>
            <button class="login-button" onclick="window.location.href='login.html'">Log In</button>
          </div>
        </div>
      </div>


      <div class="form-section">
        <form class="registration-form" id="registrationForm">

          <section class="form-group">
            <h2 class="section-title">Personal Information</h2>
            <div class="form-row">
              <div class="form-field">
                <label>First Name</label>
                <input type="text" placeholder="enter your first name" id="firstname"/>
                <p id="firstname-error" style="padding: 5px;"></p>
              </div>
              <div class="form-field">
                <label>Last Name</label>
                <input type="text" placeholder="enter your last name" id="lastname"/>
                <p id="lastname-error" style="padding: 5px;"></p>
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label>Email Address</label>
                <input type="email" placeholder="example @test.com" id="email"/>
                <p id="email-error" style="padding: 5px;"></p>
              </div>
              <div class="form-field">
                <label>Phone Number</label>
                <input type="tel" placeholder="+27" id="phone"/>
                <p id="phone-error" style="padding: 5px;"></p>
              </div>
            </div>
          </section>

          <section class="form-group">
            <h2 class="section-title">Secure Your Account</h2>
            <div class="form-row">
              <div class="form-field">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" id="password"/>
                <p id="password-error" style="padding: 5px;"></p>
              </div>
              <div class="form-field">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm password" id="confirmPassword"/>
                <p id="confirmpassword-error" style="padding: 5px;"></p>
              </div>
            </div>
          </section>

          <button type="submit" class="btn submit-button" id="submit">Create Account</button>

          <div class="auth-divider">
              <span></span>
              <p>OR</p>
              <span></span>
          </div>

          <button type="button" class="btn google-signup-btn" id="googleSignup">
            <img src="../images/google.png" alt="Google logo">
            Continue with Google
          </button>
        </form>
      </div>
    </div>
 
    <script src="../scripts/registration.js"></script>
</body>
</html>
