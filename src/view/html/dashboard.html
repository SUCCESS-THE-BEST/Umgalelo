<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title  id="user-page-title">Dashboard</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Inknut+Antiqua:wght@800&family=Josefin+Sans:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="page-loader" id="pageLoader"></div>
        <!-- sidebar -->

        <button class="mobile-menu-toggle" id="mobileMenuToggle">
            ☰
        </button>
        <button id="sidebarToggle" class="sidebar-toggle">
            ☰
        </button>

        <aside class='sidebar'>
            <div class="sidebar-logo">
                <img src='../images/umgalelo.png' alt="UMGALELO" />
            </div>

            <hr class="sidebar-divider" />

            <div class="user-profile" onclick="window.location.href='profile.html'">
                <img src='../images/profile.webp' alt="User" class="user-avatar" />
                <div class="user-info">
                    <h3></h3>
                    <p style="color: white;"></p>
                </div>
            </div>

            <hr class="sidebar-divider" />

            <nav>
                <div class="nav-section">
                    <h4>Main</h4>
                    <div class="nav-item active" onclick="window.location.href='dashboard.html'">
                        <img src='../images/dashboard (4).png' alt="" />
                        <span>Dashboard</span>
                    </div>
                </div>

                <div class="nav-section">
                    <h4>My Societies</h4>
                    <div id="sidebarSocieties">

                    </div>
                </div>

                <div class="nav-section">
                    <h4>Discover</h4>
                    <div class="nav-item" onclick="window.location.href='browse.html'">
                        <img src='../images/search-interface-symbol (2).png' alt="" />
                        <span>Browse Societies</span>
                    </div>
                    <div class="nav-item" onclick="window.location.href='createSociety.html'">
                        <img src='../images/more (1).png' alt="" />
                        <span>Create Society</span>
                    </div>
                </div>
            </nav>

            <div class="sign-out">
                <div class="nav-item" onclick="logout()">
                    <img src='../images/logout.png' alt="" />
                    <span>Sign out</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="page-title">
                    <h3><h3>
                </div>
                <div class="user-profile">
                    <div class="notification-wrapper">
                        <button class="notification-btn" id="notificationBtn">
                            <img 
                                src='../images/notification (1).png' 
                                alt="Notifications" 
                                class="header-notification" 
                                width="25px"
                            />

                            <span class="notification-count" id="notificationCount"></span>
                        </button>

                        <div class="notification-dropdown" id="notificationDropdown">
                            <div class="notification-header">
                                Notifications
                            </div>

                            <div id="notificationList">
                                <!-- notifications render here -->
                            </div>
                        </div>
                    </div>
                    <img src='../images/profile.webp' alt="User" class="user-avatar" />
                    <div class="user-info" onclick="window.location.href='profile.html'">
                        <h3></h3>
                        <p></p>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">
                <div class="content-wrapper">
                    <!-- Left Column -->
                    <div class="left-column">
                        <!-- Personal Summary -->
                        <section class="summary-section">
                            <div class="summary-header">
                                <h2>Personal Summary</h2>
                            </div>
                            <div class="summary-cards">
                                <div class="summary-card">
                                    <div>
                                        <img src="../images/networking.png" alt="" width="30px">
                                        <h3>My Societies</h3>
                                    </div>
                                    <div class="number" id="society-count"></div>
                                </div>
                                <div class="summary-card">
                                    <div>
                                        <img src="../images/credit-card (1).png" alt="" width="30px">
                                        <h3>Payments Due</h3>
                                    </div>
                                    <div class="number" id="payments-due"></div>
                                </div>
                                <div class="summary-card">
                                    <div>
                                        <img src="../images/document (2).png" alt="" width="30px">
                                        <h3>Pending Claims</h3>
                                    </div>
                                    <div class="number" id="pending-claims">0</div>
                                </div>
                            </div>
                        </section>

                        <!-- My Societies -->
                        <section class="societies-section">
                            <div class="societies-header">
                                <h2>My Societies</h2>
                            </div>

                            <div class="society-cards">

                            </div>

                            <!-- Action Buttons -->
                            <div class="action-buttons">
                                <button class="btn btn-outline" onclick="window.location.href='createSociety.html'">
                                    <img src="../images/add (1).png" width="20px">
                                    Create Society
                                </button>
                                <button class="btn btn-primary" onclick="window.location.href='browse.html'">
                                    <img src="../images/search-interface-symbol (2).png" width="20px" alt="">
                                    Browse Societies
                                </button>
                            </div>
                        </section>
                    </div>

                    <!-- Right Column -->
                    <div class="right-column">
                        <!-- Payment History -->
                        <section class="payment-history">
                            <h2>Payment History</h2>
                        </section>

                        <!-- Calendar -->
                        <section class="calendar-section">
                            <h2>My Calendar</h2>
                        </section>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../scripts/common.js"></script>
    <script src="../scripts/notifications.js"></script>
    <script src="../scripts/dashboard.js"></script>
</body>
</html>
