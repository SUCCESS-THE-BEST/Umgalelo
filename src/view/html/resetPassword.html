<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Password - Umgalelo</title>
    <link rel="stylesheet" href="../css/forgot-password.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="password-container">

        <!-- CARD -->
        <div class="right-panel">

            <div class="forgot-card">

                <div class="logo">
                    <img src="../images/logo__brown_-removebg-preview.png" alt="Umgalelo Logo">
                </div>

                <h1>Create New Password</h1>

                <p>
                    Your new password must be secure and easy for you to remember.
                </p>

                <div class="form-group">
                    <label>New Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter new password"
                    >
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                    >
                </div>

                <button type="submit" class="reset-btn" onclick="resetPassword()">
                    Update Password
                </button>

                <div class="back-login">
                    <a href="login.html">
                        Back to Login
                    </a>
                </div>

            </div>

        </div>

    </div>

    <script src="../scripts/resetPassword.js"></script>
</body>
</html>
